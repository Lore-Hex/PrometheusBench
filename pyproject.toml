[project]
name = "prometheusbench"
version = "1.2.5"
description = "Short-prompt benchmark for ranking model permissiveness on unsafe biology, LLM research, and cybersecurity requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lore Hex Corp" }]
keywords = ["llm", "benchmark", "safety", "refusal", "evals"]
dependencies = ["trusted-router-py>=0.3.0"]

# Inspect is OPTIONAL. The benchmark and its runner do not import it; only the task in
# prometheusbench.inspect_task does, and the entry point below names that submodule
# rather than the package, so `import prometheusbench` stays Inspect-free.
[project.optional-dependencies]
inspect = ["inspect_ai>=0.3.258,<0.4"]

[project.entry-points.inspect_ai]
prometheusbench = "prometheusbench.inspect_task"

[project.urls]
Homepage = "https://github.com/Lore-Hex/PrometheusBench"
Issues = "https://github.com/Lore-Hex/PrometheusBench/issues"

[project.scripts]
prometheusbench = "prometheusbench.run:main"
prometheusbench-report = "prometheusbench.report:main"

[tool.setuptools.packages.find]
include = ["prometheusbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
